services:
  financialjuice-monitor:
    build: .
    container_name: financialjuice-monitor
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    env_file: .env
    environment:
      - TZ=America/New_York
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,sys,time; sys.exit(0 if os.path.exists('/tmp/healthcheck') and time.time()-os.path.getmtime('/tmp/healthcheck')<300 else 1)\""]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
