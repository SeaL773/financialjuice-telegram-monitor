<svg xmlns="http://www.w3.org/2000/svg" width="860" height="460" viewBox="0 0 860 460" role="img" aria-labelledby="title desc">
  <title id="title">Example FinancialJuice Telegram alert</title>
  <desc id="desc">A fictional bilingual breaking-news message showing an English alert and Chinese translation.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17242c"/>
      <stop offset="1" stop-color="#253b46"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".34"/>
    </filter>
  </defs>
  <rect width="860" height="460" rx="26" fill="url(#page)"/>
  <circle cx="56" cy="53" r="18" fill="#54c7e2"/>
  <path d="M47 53h18M56 44v18" stroke="#17242c" stroke-width="4" stroke-linecap="round"/>
  <text x="86" y="51" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="21" font-weight="700">FinancialJuice → Telegram</text>
  <text x="86" y="73" fill="#9cb0bb" font-family="Inter,Segoe UI,sans-serif" font-size="13">fictional preview · no live headline data</text>

  <g transform="translate(70 105)" filter="url(#shadow)" font-family="Inter,Segoe UI,sans-serif">
    <rect width="720" height="305" rx="22" fill="#202f38" stroke="#35505e"/>
    <text x="30" y="45" fill="#ff6868" font-size="16" font-weight="700">BREAKING</text>
    <text x="30" y="82" fill="#fff" font-size="20" font-weight="700">Central bank keeps policy rate unchanged</text>
    <text x="30" y="113" fill="#d4dee3" font-size="15">Statement notes easing price pressure and resilient activity.</text>
    <line x1="30" y1="141" x2="690" y2="141" stroke="#405864"/>
    <text x="30" y="178" fill="#54c7e2" font-size="20" font-weight="700">央行维持政策利率不变</text>
    <text x="30" y="210" fill="#d4dee3" font-size="15">声明指出价格压力正在缓解，经济活动保持韧性。</text>
    <rect x="30" y="239" width="290" height="38" rx="10" fill="#17242c"/>
    <text x="47" y="264" fill="#94aab5" font-size="13">Source time: 14:00 26 August 2026</text>
    <circle cx="665" cy="258" r="18" fill="#2aabee"/>
    <path d="M654 258l22-9-7 22-6-7-5 4 1-7z" fill="#fff"/>
  </g>
</svg>
