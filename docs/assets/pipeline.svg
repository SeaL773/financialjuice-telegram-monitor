<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">FinancialJuice to Telegram pipeline</title>
  <desc id="desc">FinancialJuice feeds are normalized, revision checked, archived, delivered to Telegram, and optionally translated.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18242d"/>
      <stop offset="1" stop-color="#263842"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".24"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#54c7e2"/>
    </marker>
  </defs>
  <rect width="1200" height="360" rx="26" fill="url(#bg)"/>
  <text x="60" y="54" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="26" font-weight="700">Live headline delivery, without a browser</text>
  <text x="60" y="82" fill="#a9bac5" font-family="Inter,Segoe UI,sans-serif" font-size="15">Centrifugo primary · SignalR fallback · bounded polling · durable revision state</text>

  <g filter="url(#shadow)" font-family="Inter,Segoe UI,sans-serif">
    <g transform="translate(55 125)">
      <rect width="220" height="145" rx="18" fill="#22313a" stroke="#54c7e2" stroke-width="2"/>
      <circle cx="40" cy="42" r="18" fill="#54c7e2"/>
      <path d="M31 42h18M40 33v18" stroke="#18242d" stroke-width="4" stroke-linecap="round"/>
      <text x="70" y="39" fill="#fff" font-size="18" font-weight="700">FinancialJuice</text>
      <text x="70" y="61" fill="#91a6b3" font-size="13">Centrifugo / SignalR</text>
      <text x="24" y="101" fill="#c9d5dc" font-size="14">New headline</text>
      <text x="24" y="125" fill="#c9d5dc" font-size="14">Same-ID content update</text>
    </g>

    <g transform="translate(370 125)">
      <rect width="250" height="145" rx="18" fill="#22313a" stroke="#708994"/>
      <path d="M30 34h30v30H30z" fill="none" stroke="#54c7e2" stroke-width="3"/>
      <path d="M39 45h12M39 54h16" stroke="#54c7e2" stroke-width="2"/>
      <text x="75" y="43" fill="#fff" font-size="18" font-weight="700">Revision engine</text>
      <text x="75" y="64" fill="#91a6b3" font-size="13">Fingerprint + durable state</text>
      <text x="24" y="101" fill="#c9d5dc" font-size="14">Breaking / upgrade detection</text>
      <text x="24" y="125" fill="#c9d5dc" font-size="14">Archive and retry queues</text>
    </g>

    <g transform="translate(715 125)">
      <rect width="200" height="145" rx="18" fill="#22313a" stroke="#708994"/>
      <path d="M31 35l28 12-28 12 5-12z" fill="#54c7e2"/>
      <text x="73" y="44" fill="#fff" font-size="18" font-weight="700">Telegram</text>
      <text x="73" y="65" fill="#91a6b3" font-size="13">Edit-first delivery</text>
      <text x="24" y="101" fill="#c9d5dc" font-size="14">Complete English alert</text>
      <text x="24" y="125" fill="#c9d5dc" font-size="14">Resumable message groups</text>
    </g>

    <g transform="translate(1000 125)">
      <rect width="145" height="145" rx="18" fill="#22313a" stroke="#708994"/>
      <text x="24" y="43" fill="#54c7e2" font-size="23" font-weight="700">A</text>
      <text x="50" y="43" fill="#fff" font-size="18" font-weight="700">文</text>
      <text x="24" y="73" fill="#91a6b3" font-size="13">Optional API</text>
      <text x="24" y="102" fill="#c9d5dc" font-size="14">Translation</text>
      <text x="24" y="125" fill="#c9d5dc" font-size="14">Revision guarded</text>
    </g>
  </g>

  <path d="M285 197h72" stroke="#54c7e2" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M630 197h72" stroke="#54c7e2" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M925 197h62" stroke="#54c7e2" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
